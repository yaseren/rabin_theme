[project]
name = "rabin_theme"
version = "0.1.0"
description = "Modern Persian RTL theme for Frappe Framework and ERPNext v16"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Rabin" }]
dependencies = []

[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "rabin_theme"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"
